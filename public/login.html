<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Yapp</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/assets/css/base.css">
</head>

<body>
    <div class="auth-page auth-page-branded">
        <section class="auth-visual" aria-label="Yapp">
            <div class="auth-brand"><span class="auth-brand-mark" aria-hidden="true">Y</span><span>Yapp</span></div>
            <img class="auth-image" src="/assets/images/home.jpg" alt="People sharing ideas through Yapp">
        </section>
        <div class="auth-container">
            <header class="auth-header">
                <h1 id="login-heading">Log in to Yapp</h1>
                <p>Welcome back</p>
            </header>
            <form id="login-form" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="identifier">Username or email</label>
                    <input type="text" id="identifier" name="identifier" required autocomplete="username">
                    <span class="error-message" id="identifier-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <span class="error-message" id="password-error"></span>
                </div>

                <div class="form-group">
                    <label class="checkbox-label"><input type="checkbox" id="remember-me" name="remember_me"> Remember
                        me for 30 days</label>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log in</button>
            </form>

            <p class="auth-footer">
                Don't have an account? <a href="/register.html">Sign up</a>
            </p>
        </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="/assets/js/api.js?v=2"></script>
    <script src="/assets/js/login.js?v=3"></script>
</body>

</html>
