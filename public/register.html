<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Yapp</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/assets/css/base.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <header class="auth-header">
                <h1>Create your account</h1>
                <p>Join the conversation</p>
            </header>

            <form id="register-form" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="display_name">Display name</label>
                    <input type="text" id="display_name" name="display_name" required maxlength="50" autocomplete="name">
                    <span class="error-message" id="display_name-error"></span>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-with-prefix">
                        <span class="prefix">@</span>
                        <input type="text" id="username" name="username" required maxlength="20" autocomplete="username" pattern="[a-zA-Z0-9_]{3,20}">
                    </div>
                    <span class="error-message" id="username-error"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required maxlength="255" autocomplete="email">
                    <span class="error-message" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password">
                    <span class="error-message" id="password-error"></span>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
                    <span class="error-message" id="confirm_password-error"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="register-btn">Create account</button>
            </form>

            <p class="auth-footer">
                Already have an account? <a href="/login.html">Log in</a>
            </p>
        </div>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="/assets/js/api.js?v=2"></script>
    <script src="/assets/js/register.js?v=2"></script>
</body>
</html>
