<VirtualHost *:80>
    ServerName yapp.local
    DocumentRoot /var/www/yapp/public

    <Directory /var/www/yapp/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/yapp-error.log
    CustomLog ${APACHE_LOG_DIR}/yapp-access.log combined
</VirtualHost>
